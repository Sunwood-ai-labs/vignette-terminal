<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vignette Terminal</title>
    <script type="module" src="/main.js" defer></script>
  </head>
  <body>
    <div class="media-layer" id="mediaLayer">
      <div class="default-backdrop"></div>
    </div>

    <main class="shell">
      <header class="topbar" data-tauri-drag-region>
        <div class="brand drag-handle" data-tauri-drag-region><span class="signal" data-tauri-drag-region></span><span data-tauri-drag-region>Vignette Terminal</span></div>
        <div class="drag-strip drag-handle" data-tauri-drag-region></div>
        <nav class="controls">
          <button id="shuffleMedia" title="背景動画をランダム再生">Shuffle</button>
          <button id="pickMedia" title="背景画像または動画を選択">背景</button>
          <label title="背景の暗さ"><span>Dim</span><input id="dim" type="range" min="0" max="85" value="22" /></label>
          <label title="背景のぼかし"><span>Blur</span><input id="blur" type="range" min="0" max="18" value="0" /></label>
          <div class="window-controls">
            <button id="minimizeWindow" title="最小化" aria-label="最小化"></button>
            <button id="toggleMaximizeWindow" title="最大化" aria-label="最大化"></button>
            <button id="closeWindow" title="閉じる" aria-label="閉じる"></button>
          </div>
        </nav>
      </header>
      <section class="terminal-frame"><div id="terminal"></div></section>
    </main>
  </body>
</html>
